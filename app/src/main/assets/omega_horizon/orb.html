<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: transparent;
  }
</style>
</head>
<body>
<canvas id="orbCanvas"></canvas>
<script src="./jarvis-orb.js"></script>
<script>
  (function () {
    var canvas = document.getElementById('orbCanvas');
    var orb = null;
    try {
      orb = window.JarvisOrb.create(canvas, { quality: 'balanced', state: 'idle' });
    } catch (e) {
      console.error('JarvisOrb init failed:', e);
    }
    window.OmegaBridge = {
      setState: function (s) { if (orb && orb.setState) orb.setState(s); },
      setLevel: function (v) { if (orb && orb.setLevel) orb.setLevel(Number(v) || 0); },
      pulse: function () { if (orb && orb.pulse) orb.pulse(); },
      flash: function () { if (orb && orb.flash) orb.flash(); }
    };
  })();
</script>
</body>
</html>
