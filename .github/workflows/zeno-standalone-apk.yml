name: Build standalone ZENO AI APK

on:
  workflow_dispatch:
  push:
    branches: [ standalone-zeno-v2 ]
    paths:
      - 'zeno_ai_v2_standalone_ready.zip'
      - '.github/workflows/zeno-standalone-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZENO project
        run: |
          unzip -q zeno_ai_v2_standalone_ready.zip
          test -f zeno_ai_app/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: zeno_ai_app
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zeno-ai-v2-debug-apk
          path: zeno_ai_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
