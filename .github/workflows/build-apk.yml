name: THANISH AI APK Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, pandu-babu-accessibility-gemini, pandu-babu-v1.2-multi-ai, omega-native-master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Create Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Provision official offline Vosk English model
        run: |
          set -euo pipefail
          MODEL=vosk-model-small-en-us-0.15
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 180 \
            "https://alphacephei.com/vosk/models/${MODEL}.zip" -o "$RUNNER_TEMP/vosk-model.zip"
          unzip -tq "$RUNNER_TEMP/vosk-model.zip"
          python3 - <<'PY'
          import hashlib, pathlib, zipfile, shutil
          import os
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "vosk-model.zip"
          target = pathlib.Path("app/src/main/assets/model-en-us")
          target.mkdir(parents=True, exist_ok=True)
          root = "vosk-model-small-en-us-0.15/"
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  if not entry.filename.startswith(root) or entry.is_dir():
                      continue
                  relative = pathlib.PurePosixPath(entry.filename[len(root):])
                  if relative.is_absolute() or ".." in relative.parts:
                      raise ValueError("Unsafe model archive path")
                  out = target.joinpath(*relative.parts)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(entry) as src, out.open("wb") as dst:
                      shutil.copyfileobj(src, dst)
          for file in ("am/final.mdl", "conf/model.conf", "graph/phones/word_boundary.int"):
              assert (target / file).stat().st_size > 0, file
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (target / "uuid").write_text(digest, encoding="ascii")
          print("Official model archive SHA256 (observed):", digest)
          print("Model files:", sum(p.is_file() for p in target.rglob("*")))
          PY

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PANDU-BABU-JARVIS-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
