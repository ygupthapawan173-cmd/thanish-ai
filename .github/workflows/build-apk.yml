name: Build & Verify JARVIS INFINITY V100.2 voice collection candidate APK

on:
  push:
    branches: [ main, master, 'omega-auto/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      neural_wake:
        description: "Non-commercial openWakeWord model test only (CC BY-NC-SA 4.0)"
        type: boolean
        default: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Provision voice models
        run: |
          bash ci/provision-vosk.sh
          bash ci/provision-neural-vad.sh
          if [[ "${{ inputs.neural_wake }}" == "true" ]]; then bash ci/provision-neural-wake.sh; fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test actual neural model on CPU
        run: |
          python3 -m venv "$RUNNER_TEMP/vad-test-env"
          "$RUNNER_TEMP/vad-test-env/bin/pip" install onnxruntime==1.22.0
          "$RUNNER_TEMP/vad-test-env/bin/python" ci/check-neural-model.py
          if [[ "${{ inputs.neural_wake }}" == "true" ]]; then "$RUNNER_TEMP/vad-test-env/bin/python" ci/check-neural-wake.py; fi

      - name: Verify V47 source guards
        run: |
          python3 ci/check-v47-source.py
          python3 ci/check-v50-source.py
          python3 ci/check-v100-source.py
          python3 ci/check-v101-wake-source.py
          python3 ci/check-v102-voice-source.py
      - name: Run Mandatory Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build V100.2 voice collection candidate Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Compute Mandatory SHA-256 & Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_PATH" | grep -F "versionName='100.2-voice-choice-candidate'"
          sha256sum "$APK_PATH" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          ls -lh "$APK_PATH"

      - name: Upload V100.2 voice collection candidate APK & Checksum
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-INFINITY-V100.2-VOICE-COLLECTION-TEST
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
