name: THANISH AI APK Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main, omega-native-master, 'review/omega-r100-single-master-patch', 'review/omega-r103-safe-integrated-build', 'review/omega-r104-complete-premium-master', 'review/omega-r105-architecture']
  push:
    branches: [main, pandu-babu-accessibility-gemini, pandu-babu-v1.2-multi-ai, omega-native-master, 'review/omega-premium-no-slots-20261126', 'review/omega-r103-safe-integrated-build', 'review/omega-r104-complete-premium-master', 'review/omega-r105-architecture', 'review/omega-r106-recovery']

concurrency:
  group: omega-apk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Create Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Provision official offline Vosk English model
        run: |
          set -euo pipefail
          MODEL=vosk-model-small-en-us-0.15
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 180 \
            "https://alphacephei.com/vosk/models/${MODEL}.zip" -o "$RUNNER_TEMP/vosk-model.zip"
          echo "30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498  $RUNNER_TEMP/vosk-model.zip" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/vosk-model.zip"
          python3 - <<'PY'
          import hashlib, pathlib, zipfile, shutil
          import os
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "vosk-model.zip"
          target = pathlib.Path("app/src/main/assets/model-en-us")
          target.mkdir(parents=True, exist_ok=True)
          root = "vosk-model-small-en-us-0.15/"
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  if not entry.filename.startswith(root) or entry.is_dir():
                      continue
                  relative = pathlib.PurePosixPath(entry.filename[len(root):])
                  if relative.is_absolute() or ".." in relative.parts:
                      raise ValueError("Unsafe model archive path")
                  out = target.joinpath(*relative.parts)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(entry) as src, out.open("wb") as dst:
                      shutil.copyfileobj(src, dst)
          for file in ("am/final.mdl", "conf/model.conf", "graph/phones/word_boundary.int"):
              assert (target / file).stat().st_size > 0, file
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (target / "uuid").write_text(digest, encoding="ascii")
          print("Official model archive SHA256 (observed):", digest)
          print("Model files:", sum(p.is_file() for p in target.rglob("*")))
          PY

      - name: OMEGA premium review gates
        run: python3 ci/omega_review_checks.py

      - name: Provision pinned Robolectric API 35 and 36 runtime jars
        run: bash ci/prepare-robolectric-runtime.sh

      - name: Run unit tests
        run: bash ci/omega-gradle-retry.sh testDebugUnitTest

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OMEGA-UNIT-TEST-EVIDENCE
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Compile runtime UI tests
        run: bash ci/omega-gradle-retry.sh assembleDebugAndroidTest

      - name: Build APK
        run: bash ci/omega-gradle-retry.sh assembleDebug

      - name: Verify APK signature and bundled model
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              for path in ("assets/model-en-us/am/final.mdl", "assets/model-en-us/conf/model.conf",
                           "assets/model-en-us/graph/phones/word_boundary.int", "assets/model-en-us/uuid"):
                  assert apk.getinfo(path).file_size > 0, path
              names = apk.namelist()
              assert any(n.startswith("lib/arm64-v8a/") and n.endswith("/libvosk.so") for n in names), "Vosk ARM64 library missing"
              assert any(n.startswith("lib/arm64-v8a/") and n.endswith("/libjnidispatch.so") for n in names), "JNA ARM64 library missing"
              print("Offline model and ARM64 libraries verified")
          PY
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OMEGA-PREMIUM-REVIEW-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Enable KVM for Android 16 runtime review
        if: github.ref_name == 'review/omega-r105-architecture' || github.head_ref == 'review/omega-r105-architecture' || github.ref_name == 'review/omega-r106-recovery' || github.head_ref == 'review/omega-r106-recovery'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 emulator runtime UI tests
        if: github.ref_name == 'review/omega-r105-architecture' || github.head_ref == 'review/omega-r105-architecture' || github.ref_name == 'review/omega-r106-recovery' || github.head_ref == 'review/omega-r106-recovery'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ci/omega-gradle-retry.sh connectedDebugAndroidTest

      # Isolated package: safer than uninstalling an existing debug-signed OMEGA.
      # Firebase App Check is not registered for this package; direct Gemini key
      # testing is the sole purpose of the diagnostic artifact.
      - name: Prepare side-by-side diagnostic application ID
        run: python3 ci/prepare_side_by_side_debug.py

      - name: Build side-by-side Gemini diagnostic APK
        run: bash ci/omega-gradle-retry.sh assembleDebug

      - name: Verify isolated diagnostic package and signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "name='com.aistudio.pandubabu.kxmpzq.diagnostic'"
          sha256sum "$APK"

      - name: Upload side-by-side Gemini connection diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: OMEGA-GEMINI-CONNECTION-DIAGNOSTIC-SIDE-BY-SIDE
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
