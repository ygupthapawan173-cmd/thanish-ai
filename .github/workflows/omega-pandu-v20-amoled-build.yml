name: OMEGA PANDU V20 AMOLED DOTTED ORB APK
on:
  push:
    branches: [build/omega-pandu-v20-amoled]
    paths: [OMEGA-PANDU-v20-AMOLED-DOTTED-ORB.zip]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify and extract exact V20 source
        run: |
          echo "a60a3e2960d95aace11700743ea092d8f625e342d52290c061231806bf283872  OMEGA-PANDU-v20-AMOLED-DOTTED-ORB.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile, pathlib, stat
          with zipfile.ZipFile('OMEGA-PANDU-v20-AMOLED-DOTTED-ORB.zip') as z:
              assert z.testzip() is None
              assert len([i for i in z.infolist() if not i.is_dir()]) == 77
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert not stat.S_ISLNK(i.external_attr >> 16)
              z.extractall('omega-v20-build')
          PY
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Run original unit tests
        working-directory: omega-v20-build
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build original debug APK
        working-directory: omega-v20-build
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature package and version
        run: |
          mkdir -p out
          cp omega-v20-build/app/build/outputs/apk/debug/app-debug.apk out/OMEGA-PANDU-v20-AMOLED-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/OMEGA-PANDU-v20-AMOLED-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/OMEGA-PANDU-v20-AMOLED-TEST.apk | grep -F "name='com.aistudio.pandubabu.omega.v19ultra'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/OMEGA-PANDU-v20-AMOLED-TEST.apk | grep -F "versionName='20.0-amoled'"
          sha256sum out/*.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OMEGA-PANDU-v20-AMOLED-TEST
          path: out/
          if-no-files-found: error
