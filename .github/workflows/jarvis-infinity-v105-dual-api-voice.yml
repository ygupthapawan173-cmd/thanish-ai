name: JARVIS INFINITY V105 DUAL API VOICE TEST
on:
  push:
    branches: [main, build/jarvis-infinity-v105-dual-api-voice]
    paths:
      - JARVIS-INFINITY-V105-DUAL-API-VOICE.zip
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify and extract V105 dual API voice source
        run: |
          echo '22bbe13a8d61f07a502dd42df439edd44e09fcc41fb4b6a8b4cd7fd55e49a342  JARVIS-INFINITY-V105-DUAL-API-VOICE.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,pathlib,stat
          with zipfile.ZipFile('JARVIS-INFINITY-V105-DUAL-API-VOICE.zip') as z:
              assert z.testzip() is None and len(z.namelist()) < 1000
              assert len(set(z.namelist())) == len(z.namelist())
              assert sum(i.file_size for i in z.infolist()) < 100_000_000
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK(i.external_attr >> 16)
              z.extractall('infinity-v105-dual-api-voice-build')
          root = pathlib.Path('infinity-v105-dual-api-voice-build')
          import hashlib
          manifest = (root/'SOURCE-MANIFEST.sha256').read_text().splitlines()
          expected = {}
          for line in manifest:
              digest, name = line.split('  ', 1)
              assert name not in expected and not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts
              expected[name] = digest
          actual = {str(f.relative_to(root)) for f in root.rglob('*') if f.is_file() and f.name != 'SOURCE-MANIFEST.sha256'}
          assert actual == set(expected)
          for name, digest in expected.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == digest, name
          PY
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Provision voice models
        working-directory: infinity-v105-dual-api-voice-build
        run: |
          bash ci/provision-vosk.sh
          bash ci/provision-neural-vad.sh
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test genuine neural model on CPU
        working-directory: infinity-v105-dual-api-voice-build
        run: |
          python3 -m venv "$RUNNER_TEMP/vad-test-env"
          "$RUNNER_TEMP/vad-test-env/bin/pip" install onnxruntime==1.22.0
          "$RUNNER_TEMP/vad-test-env/bin/python" ci/check-neural-model.py
      - name: Verify non-destructive migration SQL
        working-directory: infinity-v105-dual-api-voice-build
        run: python3 ci/check-level6-sql.py
      - name: Verify V47 source guards
        working-directory: infinity-v105-dual-api-voice-build
        run: |
          python3 ci/check-v47-source.py
          python3 ci/check-v50-source.py
          python3 ci/check-v100-source.py
          python3 ci/check-v101-wake-source.py
          python3 ci/check-v102-voice-source.py
          python3 ci/check-v103-online-source.py
          python3 ci/check-v104-cloud-source.py
          python3 ci/check-v105-actions-source.py
          python3 ci/check-v106-power-source.py
          python3 ci/check-v107-online-source.py
          python3 ci/check-v108-wake-source.py
          python3 ci/check-v109-neural-source.py
          python3 ci/check-v110-dual-source.py
      - name: Compile and run regression tests
        working-directory: infinity-v105-dual-api-voice-build
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build test APK
        working-directory: infinity-v105-dual-api-voice-build
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify signature, package, version and model integrity
        run: |
          mkdir -p out
          cp infinity-v105-dual-api-voice-build/app/build/outputs/apk/debug/app-debug.apk out/JARVIS-INFINITY-V105-DUAL-API-VOICE-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/*.apk | grep -F "name='com.aistudio.pandubabu.omega.v19ultra'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/*.apk | grep -F "versionName='105.0-dual-api-candidate'"
          python3 - <<'PY'
          import zipfile,hashlib
          with zipfile.ZipFile('out/JARVIS-INFINITY-V105-DUAL-API-VOICE-TEST.apk') as z:
              assert any(n.startswith('lib/arm64-v8a/') and n.endswith('libvosk.so') for n in z.namelist())
              assert any(n.startswith('lib/arm64-v8a/') and n.endswith('libonnxruntime.so') for n in z.namelist())
              assert not any(n.startswith("assets/model-te-in/") or "mediapipe" in n.lower() for n in z.namelist())
              prefix='assets/neural-vad/'
              assert hashlib.sha256(z.read(prefix+'silero_vad.onnx')).hexdigest()==z.read(prefix+'model.sha256').decode().strip()
              assert z.read(prefix+'LICENSE')
              wake_prefix='assets/neural-wake/'
              if wake_prefix+'hey_jarvis_v0.1.onnx' in z.namelist():
                  for model in ('melspectrogram.onnx','embedding_model.onnx','hey_jarvis_v0.1.onnx'):
                      assert hashlib.sha256(z.read(wake_prefix+model)).hexdigest()==z.read(wake_prefix+model+'.sha256').decode().strip()
                  assert z.read(wake_prefix+'MODEL-NOTICE.txt')
              for pack in ('model-en-us','model-spk'):
                  prefix='assets/'+pack+'/'
                  lines=z.read(prefix+'pack.sha256').decode().splitlines()
                  required=['final.ext.raw','mean.vec','transform.mat','mfcc.conf'] if pack=='model-spk' else ['am/final.mdl','conf/model.conf','uuid']
                  names=[line.split('  ',1)[1] for line in lines]
                  assert all(n in names for n in required)
                  for line in lines:
                      expected,name=line.split('  ',1)
                      assert hashlib.sha256(z.read(prefix+name)).hexdigest()==expected
                  print(pack,'verified',len(lines),'files')
          PY
          sha256sum out/*.apk > out/SHA256SUMS.txt
          cp infinity-v105-dual-api-voice-build/V30-INTEGRATION-STATUS.md out/
          cp infinity-v105-dual-api-voice-build/V30-LOCAL-TESTS.txt out/
          cp infinity-v105-dual-api-voice-build/V47-STATUS.md out/
          cp infinity-v105-dual-api-voice-build/V47-LOCAL-TESTS.txt out/
          cp infinity-v105-dual-api-voice-build/V50-STATUS.md out/
          cp infinity-v105-dual-api-voice-build/V50-LOCAL-TESTS.txt out/
          cp infinity-v105-dual-api-voice-build/V100-STATUS.md out/
          cp infinity-v105-dual-api-voice-build/V100-LOCAL-TESTS.txt out/
          cp infinity-v105-dual-api-voice-build/V100-CONSOLIDATED-STATUS.md out/
          cp infinity-v105-dual-api-voice-build/V100-CONSOLIDATED-FINAL-TESTS.txt out/
          cp infinity-v105-dual-api-voice-build/V100.1-WAKE-FIX.md out/
          cp infinity-v105-dual-api-voice-build/V100.2-VOICE-STATUS.md out/
          cp infinity-v105-dual-api-voice-build/V100.2-LOCAL-TESTS.txt out/
          cp infinity-v105-dual-api-voice-build/V100.3-ONLINE-ONLY.md out/
          cp infinity-v105-dual-api-voice-build/V100.4-CLOUD-ONLY.md out/
          cp infinity-v105-dual-api-voice-build/V100.5-SMART-ACTIONS.md out/
          cp infinity-v105-dual-api-voice-build/V101-FINAL-POWER.md out/
          cp infinity-v105-dual-api-voice-build/V102-FINAL-ONLINE.md out/
          cp infinity-v105-dual-api-voice-build/V103-HANDSFREE.md out/
          cp infinity-v105-dual-api-voice-build/V104-NEURAL-VOICE.md out/
          cp infinity-v105-dual-api-voice-build/V105-DUAL-API.md out/
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-INFINITY-V105-DUAL-API-VOICE-TEST
          path: out/
          if-no-files-found: error
