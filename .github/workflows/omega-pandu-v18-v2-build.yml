name: OMEGA PANDU V18 SUPREME V2 APK
on:
  push:
    branches: [build/omega-pandu-v18-supreme-v2]
    paths: [OMEGA-PANDU-v18-SUPREME-v2.zip]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify and extract unmodified user source
        run: |
          echo "8e312dc45f0819b92e34494f73243e1a94a7aae5d005eeb052324b34208ec4ea  OMEGA-PANDU-v18-SUPREME-v2.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile, pathlib, stat
          with zipfile.ZipFile('OMEGA-PANDU-v18-SUPREME-v2.zip') as z:
              assert z.testzip() is None
              assert len([i for i in z.infolist() if not i.is_dir()]) == 68
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert not stat.S_ISLNK(i.external_attr >> 16)
              z.extractall('omega-v18-build')
          PY
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Run original unit tests
        working-directory: omega-v18-build
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build original signed debug APK
        working-directory: omega-v18-build
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature and package
        run: |
          mkdir -p out
          cp omega-v18-build/app/build/outputs/apk/debug/app-debug.apk out/OMEGA-PANDU-v18-SUPREME-v2-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/OMEGA-PANDU-v18-SUPREME-v2-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/OMEGA-PANDU-v18-SUPREME-v2-TEST.apk | grep -F "name='com.aistudio.pandubabu.omega.v18supreme'"
          sha256sum out/*.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OMEGA-PANDU-v18-SUPREME-v2-TEST
          path: out/
          if-no-files-found: error
