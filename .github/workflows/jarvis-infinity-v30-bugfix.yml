name: JARVIS INFINITY V30 BUGFIX TEST
on:
  push:
    branches: [main, build/jarvis-infinity-v30-bugfix]
    paths:
      - JARVIS-INFINITY-V30.0-BUGFIX-SOURCE.zip
      - .github/workflows/jarvis-infinity-v30-bugfix.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify and extract exact V30 integration source
        run: |
          echo '571583de69033ef6c34c0a646bcd90338e16b34bf128d6bb53e59a75dca9219e  JARVIS-INFINITY-V30.0-BUGFIX-SOURCE.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,pathlib,stat
          with zipfile.ZipFile('JARVIS-INFINITY-V30.0-BUGFIX-SOURCE.zip') as z:
              assert z.testzip() is None and len(z.namelist()) == 131
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK(i.external_attr >> 16)
              z.extractall('infinity-v30-bugfix-build')
          PY
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Provision voice models
        working-directory: infinity-v30-bugfix-build
        run: bash ci/provision-vosk.sh
      - name: Compile and run regression tests
        working-directory: infinity-v30-bugfix-build
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build test APK
        working-directory: infinity-v30-bugfix-build
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify signature, package, version and model integrity
        run: |
          mkdir -p out
          cp infinity-v30-bugfix-build/app/build/outputs/apk/debug/app-debug.apk out/JARVIS-INFINITY-V30-BUGFIX-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/*.apk | grep -F "name='com.aistudio.pandubabu.omega.v19ultra'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/*.apk | grep -F "versionName='30.0-bugfix-preview'"
          python3 - <<'PY'
          import zipfile,hashlib
          with zipfile.ZipFile('out/JARVIS-INFINITY-V30-BUGFIX-TEST.apk') as z:
              assert any(n.startswith('lib/arm64-v8a/') and n.endswith('libvosk.so') for n in z.namelist())
              for pack in ('model-en-us','model-te-in','model-spk'):
                  prefix='assets/'+pack+'/'
                  lines=z.read(prefix+'pack.sha256').decode().splitlines()
                  required=['final.ext.raw','mean.vec','transform.mat','mfcc.conf'] if pack=='model-spk' else ['am/final.mdl','conf/model.conf','uuid']
                  names=[line.split('  ',1)[1] for line in lines]
                  assert all(n in names for n in required)
                  for line in lines:
                      expected,name=line.split('  ',1)
                      assert hashlib.sha256(z.read(prefix+name)).hexdigest()==expected
                  print(pack,'verified',len(lines),'files')
          PY
          sha256sum out/*.apk > out/SHA256SUMS.txt
          cp infinity-v30-bugfix-build/V30-INTEGRATION-STATUS.md out/
          cp infinity-v30-bugfix-build/V30-LOCAL-TESTS.txt out/
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-INFINITY-V30-BUGFIX-TEST
          path: out/
          if-no-files-found: error
