name: OMEGA V21.2 ELITE CLEAN LIST UI
on:
  push:
    branches: [build/omega-pandu-v21-2-elite-clean-list-ui]
    paths: [OMEGA-PANDU-v21.2-ELITE-CLEAN-LIST-UI.zip]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify and extract V21.2 source
        run: |
          echo "e4cf31d6132d02a8bedfc40d736669fe5f19384c1538fcdddd88f9e8ceae9020  OMEGA-PANDU-v21.2-ELITE-CLEAN-LIST-UI.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile,pathlib,stat,hashlib
          with zipfile.ZipFile('OMEGA-PANDU-v21.2-ELITE-CLEAN-LIST-UI.zip') as z:
              assert z.testzip() is None
              assert len(z.namelist()) == 101
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert not stat.S_ISLNK(i.external_attr >> 16)
              for name in ('final.ext.raw','mean.vec','transform.mat','mfcc.conf'):
                  assert z.getinfo('app/src/main/assets/model-spk/'+name).file_size>0
              for name, digest in {"mfcc.conf":"86f4df625b950b81b68864fdefabf26aa65079f84ea20f40e7f9e7ccbb9c456c","final.ext.raw":"d30354474ac719b3cfce58186463302b988cf22ce3afee7237a2da862c4a91d1","mean.vec":"3bc5dfa9479c3aaacf4f45c155e9bd4772785449112566fac23578c09e93bcd7","transform.mat":"fab14481fb27c41df0f1825afe18530e4f6d128dbb2c239ee86d8d7096e22c33"}.items():
                  assert hashlib.sha256(z.read('app/src/main/assets/model-spk/'+name)).hexdigest()==digest
              z.extractall('omega-v212-build')
          PY
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Provision pinned English Vosk model
        working-directory: omega-v212-build
        run: bash ci/provision-vosk.sh
      - name: Compile and run ELITE voice regression tests
        working-directory: omega-v212-build
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build test APK
        working-directory: omega-v212-build
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature package and both model packs
        run: |
          mkdir -p out
          cp omega-v212-build/app/build/outputs/apk/debug/app-debug.apk out/OMEGA-PANDU-v21.2-ELITE-CLEAN-LIST-UI-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/*.apk | grep -F "name='com.aistudio.pandubabu.omega.v19ultra'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/*.apk | grep -F "versionName='21.2-elite-clean-list-ui'"
          python3 - <<'PY'
          import zipfile,hashlib
          with zipfile.ZipFile('out/OMEGA-PANDU-v21.2-ELITE-CLEAN-LIST-UI-TEST.apk') as z:
              assert z.getinfo('assets/model-en-us/am/final.mdl').file_size > 0
              assert any(n.startswith('lib/arm64-v8a/') and n.endswith('libvosk.so') for n in z.namelist())
              for name in ('final.ext.raw','mean.vec','transform.mat','mfcc.conf'):
                  assert z.getinfo('assets/model-spk/'+name).file_size>0
              for name, digest in {"mfcc.conf":"86f4df625b950b81b68864fdefabf26aa65079f84ea20f40e7f9e7ccbb9c456c","final.ext.raw":"d30354474ac719b3cfce58186463302b988cf22ce3afee7237a2da862c4a91d1","mean.vec":"3bc5dfa9479c3aaacf4f45c155e9bd4772785449112566fac23578c09e93bcd7","transform.mat":"fab14481fb27c41df0f1825afe18530e4f6d128dbb2c239ee86d8d7096e22c33"}.items():
                  assert hashlib.sha256(z.read('assets/model-spk/'+name)).hexdigest()==digest
          PY
          sha256sum out/*.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OMEGA-PANDU-v21.2-ELITE-CLEAN-LIST-UI-TEST
          path: out/
          if-no-files-found: error
