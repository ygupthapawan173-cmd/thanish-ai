name: JARVIS INFINITY V109 AUDITED WAKE SPEED

on:
  push:
    branches: [ v109-audited-v4-test ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Provision voice models
        run: |
          bash ci/provision-vosk.sh
          bash ci/provision-neural-vad.sh

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify V108 and all regression source guards
        run: |
          python3 ci/check-v108-ultimate-source.py
          python3 ci/check-v1072-control-center-source.py
          python3 ci/check-v107-autonomous-source.py
          python3 ci/check-v106-upgrade-source.py
          python3 ci/check-level6-sql.py
          python3 ci/check-v47-source.py
          python3 ci/check-v50-source.py
          python3 ci/check-v100-source.py
          python3 ci/check-v101-wake-source.py
          python3 ci/check-v102-voice-source.py
          python3 ci/check-v103-online-source.py
          python3 ci/check-v104-cloud-source.py
          python3 ci/check-v105-actions-source.py
          python3 ci/check-v106-power-source.py
          python3 ci/check-v107-online-source.py
          python3 ci/check-v108-wake-source.py
          python3 ci/check-v109-neural-source.py
          python3 ci/check-v110-dual-source.py

      - name: Run Mandatory Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build V109 Debug Candidate APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK Signing, Package, Version and SHA-256
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/JARVIS-INFINITY-V109-AUDITED-WAKE-SPEED.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/JARVIS-INFINITY-V109-AUDITED-WAKE-SPEED.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/JARVIS-INFINITY-V109-AUDITED-WAKE-SPEED.apk | grep -F "name='com.aistudio.pandubabu.omega.v19ultra'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/JARVIS-INFINITY-V109-AUDITED-WAKE-SPEED.apk | grep -F "versionName='V109 AUDITED WAKE SPEED'"
          (cd out && sha256sum JARVIS-INFINITY-V109-AUDITED-WAKE-SPEED.apk > JARVIS-INFINITY-V109-AUDITED-WAKE-SPEED.apk.sha256)
          cat out/JARVIS-INFINITY-V109-AUDITED-WAKE-SPEED.apk.sha256

      - name: Upload V109 Debug APK & Checksum
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-INFINITY-V109-AUDITED-WAKE-SPEED
          path: out/
          if-no-files-found: error

      - name: Save matching source snapshots
        run: |
          mkdir -p source-out
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, tarfile, zipfile
          from datetime import datetime, timezone

          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert sha == os.environ["GITHUB_SHA"], "Checkout does not match build commit"
          version = "V109-AUDITED-WAKE-SPEED"
          archive = subprocess.check_output(["git", "archive", "--format=tar", sha])
          out = pathlib.Path("source-out")
          full = out / f"JARVIS-INFINITY-{version}-SOURCE.zip"
          light = out / f"JARVIS-INFINITY-{version}-LIGHTWEIGHT-SOURCE.zip"
          omitted = []
          count = 0
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as tar, \
               zipfile.ZipFile(full, "w", compression=zipfile.ZIP_DEFLATED) as complete, \
               zipfile.ZipFile(light, "w", compression=zipfile.ZIP_DEFLATED) as small:
              for entry in tar:
                  if not entry.isfile():
                      continue
                  name = entry.name
                  low = name.lower()
                  basename = pathlib.PurePosixPath(low).name
                  if low.endswith((".zip", ".apk", ".aab", ".jks", ".keystore", ".p12", ".pem", ".key")) or basename in {".env", "local.properties", "google-services.json", "source-manifest.sha256", "credentials.json", "secrets.json"}:
                      omitted.append(name)
                      continue
                  data = tar.extractfile(entry).read()
                  complete.writestr(name, data)
                  if not name.startswith("app/src/main/assets/model-spk/"):
                      small.writestr(name, data)
                  count += 1
              metadata = {
                  "source_commit": sha,
                  "version": version,
                  "version_code": 117,
                  "build_run": os.environ["GITHUB_RUN_ID"],
                  "created_utc": datetime.now(timezone.utc).isoformat(),
                  "excluded_tracked_files": omitted,
                  "tracked_files_in_full": count,
                  "rebuild": "Use the matching workflow and CI model provisioning scripts. Restore any required excluded configuration from authorized local copies. Lightweight source additionally omits speaker-model weights.",
                  "note": "Source snapshots contain committed inputs, not generated binaries or CI secrets. Exclusion patterns are not a comprehensive secret scan."
              }
              for z in (complete, small):
                  z.writestr("BUILD-SOURCE-METADATA.json", json.dumps(metadata, indent=2) + "\n")
          for file in (full, light):
              with zipfile.ZipFile(file) as z:
                  assert z.testzip() is None
                  for required in ("app/build.gradle.kts", "app/src/main/java/com/example/omega/OnlineBackgroundVoiceService.kt"):
                      assert required in z.namelist(), required
              digest = hashlib.sha256(file.read_bytes()).hexdigest()
              (out / (file.name + ".sha256")).write_text(f"{digest}  {file.name}\n")
              print(file.name, file.stat().st_size, digest)
          (out / "BUILD-SOURCE-METADATA.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY

      - name: Upload matching source backups
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-INFINITY-V109-SOURCE-BACKUPS
          path: source-out/
          if-no-files-found: error
          retention-days: 90
